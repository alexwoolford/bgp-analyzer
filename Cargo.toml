[workspace]
resolver = "2"
members = [
    "crates/bgp-rib",
    "crates/bgp-ingest",
    "crates/bgp-rpki",
    "crates/bgp-detect",
    "crates/bgp-map",
    "crates/bgp-ma",
    "crates/bgp-state",
    "crates/bgp-analyzer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["BGP Analyzer Contributors"]

[workspace.lints.rust]
unused = "warn"

# Keep Clippy light: CI uses `-D warnings` on the default set.
# Prefer fixing real issues over a pedantic deny list (see domain_status for that bar).
[workspace.lints.clippy]
too_many_arguments = "allow"
manual_is_multiple_of = "allow"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4", features = ["derive"] }
ipnet = { version = "2", features = ["serde"] }
ipnet-trie = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bgpkit-broker = "0.12"
bgpkit-parser = "0.19"
valley-free = "0.3"
indexmap = "2"
oneio = "0.19"
csv = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
capturable-state = { git = "https://github.com/alexwoolford/capturable-state", tag = "v0.1.1", version = "0.1.1" }
tempfile = "3"

bgp-rib = { path = "crates/bgp-rib" }
bgp-ingest = { path = "crates/bgp-ingest" }
bgp-rpki = { path = "crates/bgp-rpki" }
bgp-detect = { path = "crates/bgp-detect" }
bgp-map = { path = "crates/bgp-map" }
bgp-ma = { path = "crates/bgp-ma" }
bgp-state = { path = "crates/bgp-state" }
